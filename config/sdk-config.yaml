sandbox:
  unix_socket: "/var/run/conchd/conchd.sock"      # Preferred: talk to conchd over local Unix socket
  api_url: "http://localhost:4063"                # Fallback: used only when unix_socket is empty
  sandbox_id: ""                                  # Optional: sandbox ID (default:auto generate)
  template_id: ""                                   # Required: tmpl_xxx

image:
  # vmm_name: ""                                  # Optional override; if unset the server's sandbox.default_vmm_name is used
  vcpu_num: 2                                     # Number of virtual CPUs
  vcpu_max: 2                                     # Max number of virtual CPUs (default: same as vcpu_num)
  ram_mb: 4096                                    # Memory size in MB

sandbox:
  unix_socket: "/var/run/conchd/conchd.sock"      # Preferred: talk to conchd over local Unix socket
  api_url: "http://localhost:4063"                # Fallback: used only when unix_socket is empty
  sandbox_id: ""                                  # Optional: sandbox ID (default:auto generate)

snapshot:
  snapshot_id: ""                                 # Snapshot ID (default:auto generate)
  vmm_name: "cloud-hypervisor"                    # *Virtual machine monitor name
  vcpu_num: 1                                     # *Number of virtual CPUs
  ram_mb: 1024                                    # *Memory size in MB

image:
  # For x86_64 architecture use: hub.oepkgs.net/conch/openeuler:odd-x86
  # For aarch64 architecture use: hub.oepkgs.net/conch/openeuler:odd-aarch
  image_name: "hub.oepkgs.net/conch/openeuler:odd-x86"
  use_snapshot: false                              # When true, treat image_name as a snapshot-start image and use the snapshot startup path
  vmm_name: "cloud-hypervisor"                    # *Virtual machine monitor name
  vcpu_num: 1                                     # *Number of virtual CPUs
  ram_mb: 1024                                    # *Memory size in MB

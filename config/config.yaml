app:
  name: conch

log:
  level: debug
  # output: "stdout" - only output to stdout
  # output: "file" - only output to file
  # output: "both" - output to both stdout and file
  output: stdout

server:
  # If unix_socket is set as empty, conchd listens on host:port via TCP. Otherwise, conchd listens on local socket by default
  unix_socket: /var/run/conchd/conchd.sock
  pid_file: /var/run/conchd/conchd.pid
  work_dir: /var/run/conch
  host: 127.0.0.1
  port: 4063

network:
  # Number of ready-to-use network slots Conch keeps warm. Must not exceed the internal total-slot limit of 4000. Default: 250
  warm_pool_size: 250
  cni:
    # CNI plugin binary search paths used for outer sandbox networking.
    # These binaries must be installed on the Linux host; the Go CNI library does not install them.
    plugin_bin_dirs:
      - /usr/libexec/cni
    # Directory containing the CNI .conf/.conflist Conch should load for sandbox networking.
    # Change this if your Conch CNI configs live somewhere else.
    # If this default directory has no config, Conch falls back to cni/net.d next to this config file.
    plugin_conf_dir: /etc/conch/cni/net.d
    # Outer sandbox interface name created by CNI; go-cni currently generates the first interface as <prefix>0
    if_name: eth0

containerd:
  root_dir: /var/lib/conch/containerd
  state_dir: /run/conch/containerd

vmm:
  cloud_hypervisor:
    binary: /usr/local/bin/cloud-hypervisor
  stratovirt:
    binary: /usr/bin/stratovirt

sandbox:
  # Global StratoVirt memory policy: full, auto, or incremental. Defaults to full.
  memory_mode: full
  # conch-cow binary started and stopped by conchd.
  cow_binary: /usr/bin/conch-cow
  # Local conch-cow control socket.
  cow_socket: /run/conch/cow.sock
  vsock_signal_retry: 10ms
  vsock_signal_timeout: 60s
  request_timeout: 60s
  # Default Template used when a create request does not specify template_id.
  default_template_id: ""
  # Hypervisor launched when a create request does not specify vmm_name.
  # Supported: "cloud-hypervisor", "stratovirt"
  default_vmm_name: stratovirt
  default_vcpu_num: 2
  default_vcpu_max: 2
  default_ram_mb: 4096

volume:
  max_mounts: 10
  backend: virtiofs
  virtiofs:
    binary: /usr/libexec/virtiofsd
    runtime_dir: /run/conch/sandboxes

state:
  path: /var/lib/conch/state.db

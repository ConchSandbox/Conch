app:
  name: conch

log:
  level: debug
  # output: "stdout" - only output to stdout
  # output: "file" - only output to file
  # output: "both" - output to both stdout and file
  output: stdout

server:
  work_dir: /var/run/conch
  state_dir: /var/lib/conch

# Private E2B Node API consumed by AgentENV Gateway. Empty listen_addr disables
# it. All candidate nodes must have the same template names/digests and artifacts.
# SDK callers must explicitly select secure=false; E2B pause/resume/connect are
# not implemented in this MVP.
e2b:
  listen_addr: ""
  # Authentication reads AENV_API_KEY, shared with AgentENV Gateway.
  # Bare Gateway DNS suffixes without scheme/port; first is returned to the SDK.
  # Empty supports SDK commands/files through E2B_SANDBOX_URL header routing.
  # get_host/app URLs require a domain and wildcard DNS pointing to Gateway,
  # e.g. ["sandboxes.example.com"], matching Gateway's sandbox_proxy_domains.
  sandbox_proxy_domains: []

cluster:
  # Empty disables reporting for a standalone E2B Node. Example: scheduler:9090.
  scheduler_addr: ""
  # Stable ID must exactly match this Node's ID in Scheduler discovery.
  node_id: ""
  # Use the same cluster_id on all nodes. service_instance_id is generated.
  cluster_id: ""

sandbox:
  backend: stratovirt
  vsock_signal_retry: 10ms
  vsock_signal_timeout: 60s
  request_timeout: 60s
  default_spec:
    # Default Template selector used when a create request does not specify one.
    # template_name and template_id are mutually exclusive.
    template_name: ""
    # template_id: "sha256:<digest>"
    vcpu_num: 2
    vcpu_max: 2
    ram_mb: 2048
  stratovirt:
    binary: /usr/bin/stratovirt
  cloud_hypervisor:
    binary: /usr/local/bin/cloud-hypervisor


network:
  # Number of ready-to-use network slots Conch keeps warm. Must not exceed the internal total-slot limit of 4000. Default: 250
  warm_pool_size: 100
  cni:
    # CNI plugin binary search paths used for outer sandbox networking.
    # These binaries must be installed on the Linux host; libcni does not install them.
    plugin_bin_dirs:
      - /usr/libexec/cni

volume:
  max_mounts: 10
  backend: virtiofs
  virtiofs:
    binary: /usr/libexec/virtiofsd

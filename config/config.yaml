app:
  name: conch

log:
  level: debug
  # output: "stdout" - only output to stdout
  # output: "file" - only output to file
  # output: "both" - output to both stdout and file
  output: stdout

server:
  # If unix_socket is set as empty, conchd listens on host:port via TCP. Otherwise, conchd listens on local socket by default
  unix_socket: /var/run/conchd/conchd.sock
  pid_file: /var/run/conchd/conchd.pid
  work_dir: /var/run/conch
  host: 127.0.0.1
  port: 4063

network:
  # CIDR capacity is at most: (4096-3*bridge_count) slots; practical max depends on host/kernel/network setup. Default: 250
  pool_size: 250
  # If setting dynamic reservation to true, then there is a background thread keep filling the pool till it reaches the max size set above
  dynamic_reservation: false
  # Number of bridges. Power-of-two values use the parent subnet most efficiently; non-power-of-two values are rounded up internally for subnet sizing.
  # Non-power-of-two bridge_count is rounded up to the next power of two for clean non-overlapping subnets, so tail address space is intentionally left unused.
  # Multi-bridge mode allocates slot IPs round-robin across bridge subnets, so addresses are spread across bridges rather than contiguous in the parent subnet.
  bridge_count: 1
  # Tap interface address inside the sandbox network namespace
  tap_ip: 192.168.100.2
  # CIDR mask for tap_ip
  tap_mask: 24

containerd:
  root_dir: /var/lib/conch/containerd
  state_dir: /run/conch/containerd
  default_namespace: default

image:
  # Default multi-arch kernel image used when converting a standard OCI image via `conch pull`
  default_kernel_image: hub.oepkgs.net/conch/kernel:6.6.0

sandbox:
  vsock_signal_retry: 10ms
  vsock_signal_timeout: 60s
  request_timeout: 60s
  default_image: hub.oepkgs.net/conch/openeuler:odd-x86
  default_vmm_name: cloud-hypervisor
  default_vcpu_num: 2
  default_vcpu_max: 2
  default_ram_mb: 4096

state:
  path: /var/lib/conch/state.db

[build-system]
requires = ["setuptools>=42.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "conch"
version = "0.2.0"
description = "SDK for conch service"
requires-python = ">=3.10"
authors = [
    { name = "Conch Team" }
]
keywords = ["conch", "sdk", "sandbox", "connect-rpc"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "requests>=2.25.0",
    "requests-unixsocket>=0.3.0",
    "connectrpc==0.11.0",
    "protoc-gen-connect-python==0.9.0",
    "protobuf>=4.21.0",
]

[project.optional-dependencies]
test = ["pytest>=7.0.0"]

[project.urls]
Homepage = "https://atomgit.com/openeuler/Conch"
Repository = "https://atomgit.com/openeuler/Conch"

[tool.setuptools]
packages = ["conch", "api.py_proto"]
package-dir = { "conch" = ".", "api.py_proto" = "../api/py_proto" }
zip-safe = false

[tool.setuptools.package-data]
"api.py_proto" = ["*.pyi"]

[tool.setuptools.exclude-package-data]
"*" = ["__pycache__/*", "*.pyc"]
